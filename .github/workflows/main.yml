name: Main CI Workflow (linting & testing)

on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
    - master

jobs:
  python-ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macOS-latest, windows-latest]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
    name: CI workflow
    steps:
      - name: checkout source repo
        uses: actions/checkout@v7
      
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          uv sync --group test --group lint --locked

      - name: linting flake8
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          uv run flake8 udkm1Dsim/ tests/
          uv run nbqa flake8 examples/
  
      - name: Generate coverage report
        run: |
          uv run pytest --cov=./udkm1Dsim --cov-report=xml --ignore=tests/benchmarks tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS, PYTHON
          fail_ci_if_error: true
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: false
        