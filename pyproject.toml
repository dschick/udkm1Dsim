[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "udkm1Dsim"
version = "2.4.0"
description = "A Python Simulation Toolkit for 1D Ultrafast Dynamics in Condensed Matter"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Daniel Schick", email = "schick.daniel@gmail.com"}
]
requires-python = ">=3.10"
keywords = [
    "ultrafast dynamics",
    "condensed matter", "1D",
    "NTM", "3TM", "2TM", "TTM", "N-temperature model", "M3TM",
    "coherent acoustic phonons",
    "sound", "strain waves",
    "resonant magnetic scattering",
    "diffraction", "spectroscopy",
    "x-ray magnetic circular dichroism",
    "Landau Lifschitz Bloch",
]
dependencies = [
    "tqdm>=4.43.0",
    "numpy",
    "pint>=0.23",
    "scipy>=1.4.1",
    "sympy>=1.5.1",
    "tabulate",
    "matplotlib>=2.0.0",
]
[dependency-groups]
test = ["pytest", "pytest-cov", "pytest-codspeed"]
lint = ["flake8", "nbqa", "ipython"]

[project.optional-dependencies]
parallel = ["dask[distributed]>=2.6.0"]
docs = [
    "sphinx>=5.0",
    "ipykernel",
    "ipywidgets",
    "IProgress",
    "autodocsumm",
    "sphinx-book-theme==1.2.0; python_version >= '3.11'",
    "sphinx_design",
    "sphinx_copybutton",
    "sphinxcontrib.bibtex",
    "pydata-sphinx-theme",
    "myst_nb",
    "myst-sphinx-gallery",
]

[project.urls]
homepage = "https://github.com/dschick/udkm1Dsim"
repository = "https://github.com/dschick/udkm1Dsim.git"
documentation = "https://https://udkm1dsim.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["udkm1Dsim"]

[tool.uv]
required-version = ">=0.12.12"

[tool.pytest.ini_options]
filterwarnings = "ignore::DeprecationWarning"

[tool.bumpversion]
current_version = "2.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Bump version: {current_version} → {new_version}"
commit = true
tag = true
push_tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "udkm1Dsim/__init__.py"

[[tool.bumpversion.files]]
filename = "docs/source/conf.py"