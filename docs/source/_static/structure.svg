<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="title">
  <title id="title">Architecture of udkm1Dsim</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 3 5 z" fill="#5b6472"/>
    </marker>
  </defs>

  <g font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif">

    <!-- ===== structures ===== -->
    <rect x="20" y="20" width="960" height="420" rx="28" fill="#dde7fb" stroke="#a8bdec" stroke-width="3"/>
    <text x="48" y="66" font-size="30" font-weight="700" fill="#2c4a8a">structures</text>

    <g fill="#ffffff" stroke="#c9ced6" stroke-width="2">
      <rect x="50" y="90" width="280" height="140" rx="14"/>
      <rect x="50" y="270" width="280" height="140" rx="14"/>
      <rect x="400" y="132" width="300" height="236" rx="14"/>
      <rect x="760" y="195" width="200" height="110" rx="14"/>
    </g>

    <g font-size="24" font-style="italic" fill="#5c6470">
      <text x="74" y="132">atoms</text>
      <text x="74" y="312">dielectric</text>
      <text x="424" y="174">layers</text>
      <text x="784" y="237">structure</text>
    </g>
    <g font-size="30" font-weight="500" fill="#1f2328">
      <text x="74" y="172">Atom</text>
      <text x="74" y="210">AtomMixed</text>
      <text x="74" y="352">Dielectric</text>
      <text x="74" y="390">Dispersion</text>
      <text x="424" y="214">Layer</text>
      <text x="424" y="252">AmorphousLayer</text>
      <text x="424" y="290">UnitCell</text>
      <text x="424" y="328">Vacuum</text>
      <text x="784" y="277">Structure</text>
    </g>

    <!-- ===== simulations ===== -->
    <rect x="20" y="500" width="960" height="760" rx="28" fill="#fbe5d6" stroke="#e5b493" stroke-width="3"/>
    <text x="48" y="546" font-size="30" font-weight="700" fill="#8a4a1f">simulations</text>

    <!-- coupled dynamics -->
    <rect x="50" y="570" width="900" height="350" rx="22" fill="#d6ebe4" stroke="#8cbfae" stroke-width="3"/>
    <!-- scattering -->
    <rect x="50" y="970" width="900" height="270" rx="22" fill="#e6e0f5" stroke="#ad9fdb" stroke-width="3"/>
    <text x="78" y="1012" font-size="28" font-weight="700" fill="#4b3d8a">scattering</text>

    <g fill="#ffffff" stroke="#c9ced6" stroke-width="2">
      <rect x="400" y="595" width="200" height="110" rx="14"/>
      <rect x="80" y="760" width="300" height="140" rx="14"/>
      <rect x="620" y="760" width="300" height="140" rx="14"/>
      <rect x="80" y="1035" width="300" height="180" rx="14"/>
      <rect x="420" y="1035" width="500" height="180" rx="14"/>
    </g>

    <g font-size="24" font-style="italic" fill="#5c6470">
      <text x="424" y="637">heat</text>
      <text x="104" y="802">phonons</text>
      <text x="644" y="802">magnetization</text>
      <text x="104" y="1077">atomistic</text>
      <text x="444" y="1077">multilayer</text>
    </g>
    <g font-size="30" font-weight="500" fill="#1f2328">
      <text x="424" y="677">Heat</text>
      <text x="104" y="842">PhononNum</text>
      <text x="104" y="880">PhononAna</text>
      <text x="644" y="842">LLG</text>
      <text x="644" y="880">iLLG</text>
      <text x="744" y="842">LLB</text>
      <text x="104" y="1117">XrayKin</text>
      <text x="104" y="1155">XrayDyn</text>
      <text x="444" y="1117">Parratt</text>
      <text x="444" y="1155">Elzo</text>
      <text x="444" y="1193">Stepanov</text>
      <text x="620" y="1117">BerremanElzo</text>
      <text x="620" y="1155">BerremanStepanov</text>
    </g>
  </g>

  <!-- ===== arrows ===== -->
  <g stroke="#5b6472" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#head)">
    <!-- structure building blocks -->
    <path d="M 336 165 L 390 195"/>
    <path d="M 336 335 L 390 305"/>
    <path d="M 706 250 L 750 250"/>
    <!-- structure feeds every simulation -->
    <path d="M 860 311 L 860 490"/>
    <!-- coupled dynamics -->
    <path d="M 390 688 L 312 748" marker-start="url(#head)"/>
    <path d="M 610 688 L 688 748" marker-start="url(#head)"/>
    <path d="M 392 830 L 608 830" marker-start="url(#head)"/>
    <!-- dynamics feed scattering -->
    <path d="M 500 852 L 500 960"/>
  </g>
</svg>
